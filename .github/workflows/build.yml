name: Build LumiRender (Windows, CUDA sm_61, no OptiX)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  PROJECT_SRC: ${{ github.workspace }}/LumiRender
  ISPC_VERSION: "1.23.0"
  CUDA_ARCH: "sm_61"
  OIDN_VERSION: "2.5.1"
  EMBREE_VERSION: "4.4.1"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    # ---------- 1. vcpkg (assimp + openimageio) ----------
    - name: Setup vcpkg
      run: |
        if (!(Test-Path "$env:VCPKG_ROOT")) {
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        }
        echo "$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache vcpkg binary archives
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ runner.os }}-vcpkg-binary-v4

    - name: Install vcpkg dependencies
      run: |
        vcpkg install assimp:x64-windows openimageio:x64-windows

    # ---------- 2. Embree (бинарный релиз) ----------
    - name: Download and Setup Embree
      shell: pwsh
      run: |
        $embreeUrl = "https://github.com/RenderKit/embree/releases/download/v$env:EMBREE_VERSION/embree-$env:EMBREE_VERSION.x64.windows.zip"
        Invoke-WebRequest -Uri $embreeUrl -OutFile embree.zip
        Expand-Archive -Path embree.zip -DestinationPath C:\embree
        $embreeRoot = Get-ChildItem -Path C:\embree -Directory | Select-Object -First 1
        $embreeBin = Join-Path $embreeRoot.FullName "bin"
        if (Test-Path $embreeBin) {
          $embreeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    # ---------- 3. OpenImageDenoise (бинарный релиз) ----------
    - name: Download and Setup OpenImageDenoise
      shell: pwsh
      run: |
        $oidnUrl = "https://github.com/RenderKit/oidn/releases/download/v$env:OIDN_VERSION/oidn-$env:OIDN_VERSION.x64.windows.zip"
        Invoke-WebRequest -Uri $oidnUrl -OutFile oidn.zip
        Expand-Archive -Path oidn.zip -DestinationPath C:\oidn
        $oidnRoot = Get-ChildItem -Path C:\oidn -Directory | Select-Object -First 1
        $oidnBin = Join-Path $oidnRoot.FullName "bin"
        if (Test-Path $oidnBin) {
          $oidnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    # ---------- 4. ISPC ----------
    - name: Install ISPC
      run: |
        $url = "https://github.com/ispc/ispc/releases/download/v$env:ISPC_VERSION/ispc-v$env:ISPC_VERSION-windows.zip"
        Invoke-WebRequest -Uri $url -OutFile ispc.zip
        Expand-Archive -Path ispc.zip -DestinationPath C:\ispc
        $ispcExe = Get-ChildItem -Path C:\ispc -Recurse -Filter ispc.exe | Select-Object -First 1
        $ispcExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ---------- 5. CUDA Toolkit ----------
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.16
      with:
        cuda: '12.4.0'
        method: 'network'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # ================= CPU BUILD =================
    - name: Configure CMake (CPU)
      run: |
        $oidnRoot = (Get-ChildItem -Path C:\oidn -Directory | Select-Object -First 1).FullName
        $embreeRoot = (Get-ChildItem -Path C:\embree -Directory | Select-Object -First 1).FullName
        
        cmake -G "Ninja" -S $env:PROJECT_SRC -B build-cpu `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_PREFIX_PATH="$oidnRoot;$embreeRoot;$env:VCPKG_ROOT/installed/x64-windows" `
          -DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=ON `
          -DLUMINOUS_BUILD_TESTS=OFF

    - name: Build (CPU)
      run: cmake --build build-cpu --config $env:BUILD_TYPE --parallel

    - name: Package CPU artefacts
      run: |
        New-Item -ItemType Directory -Force -Path out-cpu | Out-Null
        Get-ChildItem -Path build-cpu -Include *.exe,*.dll -Recurse |
          Where-Object { $_.FullName -notmatch 'CMakeFiles|check_cuda' } |
          ForEach-Object { Copy-Item $_.FullName -Destination out-cpu\ -Force }
        
        if (Test-Path "$env:VCPKG_ROOT\installed\x64-windows\bin") {
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" -Destination out-cpu\ -Force
        }
        
        $oidnRoot = (Get-ChildItem -Path C:\oidn -Directory | Select-Object -First 1).FullName
        $oidnBin = Join-Path $oidnRoot "bin"
        if (Test-Path $oidnBin) { Copy-Item "$oidnBin\*.dll" -Destination out-cpu\ -Force }
        
        $embreeRoot = (Get-ChildItem -Path C:\embree -Directory | Select-Object -First 1).FullName
        $embreeBin = Join-Path $embreeRoot "bin"
        if (Test-Path $embreeBin) { Copy-Item "$embreeBin\*.dll" -Destination out-cpu\ -Force }
        
        Compress-Archive -Path out-cpu\* -DestinationPath LumiRender-CPU.zip -Force

    # ================= GPU BUILD =================
    - name: Pre-create check_cuda.exe (sm_61 stub)
      run: |
        New-Item -ItemType Directory -Force -Path build-gpu | Out-Null
        @"
        #include <stdio.h>
        int main() { printf("sm_61"); return 0; }
        "@ | Out-File -FilePath check_cuda_stub.c -Encoding ASCII
        cl /nologo check_cuda_stub.c /Fe:build-gpu\check_cuda.exe

    - name: Configure CMake (GPU, CUDA, no OptiX)
      run: |
        $oidnRoot = (Get-ChildItem -Path C:\oidn -Directory | Select-Object -First 1).FullName
        $embreeRoot = (Get-ChildItem -Path C:\embree -Directory | Select-Object -First 1).FullName
        
        cmake -G "Ninja" -S $env:PROJECT_SRC -B build-gpu `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_PREFIX_PATH="$oidnRoot;$embreeRoot;$env:VCPKG_ROOT/installed/x64-windows" `
          -DLUMINOUS_BUILD_TESTS=OFF `
          -DLUMINOUS_RENDER_ENABLE_OPTIX=OFF

    - name: Build (GPU)
      run: cmake --build build-gpu --config $env:BUILD_TYPE --parallel

    - name: Package GPU artefacts
      run: |
        New-Item -ItemType Directory -Force -Path out-gpu | Out-Null
        Get-ChildItem -Path build-gpu -Include *.exe,*.dll -Recurse |
          Where-Object { $_.FullName -notmatch 'CMakeFiles|check_cuda' } |
          ForEach-Object { Copy-Item $_.FullName -Destination out-gpu\ -Force }
        
        if (Test-Path "$env:VCPKG_ROOT\installed\x64-windows\bin") {
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" -Destination out-gpu\ -Force
        }
        
        $oidnRoot = (Get-ChildItem -Path C:\oidn -Directory | Select-Object -First 1).FullName
        $oidnBin = Join-Path $oidnRoot "bin"
        if (Test-Path $oidnBin) { Copy-Item "$oidnBin\*.dll" -Destination out-gpu\ -Force }
        
        $embreeRoot = (Get-ChildItem -Path C:\embree -Directory | Select-Object -First 1).FullName
        $embreeBin = Join-Path $embreeRoot "bin"
        if (Test-Path $embreeBin) { Copy-Item "$embreeBin\*.dll" -Destination out-gpu\ -Force }
        
        Compress-Archive -Path out-gpu\* -DestinationPath LumiRender-GPU.zip -Force

    # ================= TEST RENDER =================
    - name: Run test render
      run: |
        New-Item -ItemType Directory -Force -Path rendertest | Out-Null
        $exe = Get-ChildItem -Path build-gpu -Filter *.exe -Recurse |
               Where-Object { $_.FullName -notmatch 'check_cuda|CMakeFiles' } |
               Select-Object -First 1
        if (-not $exe) {
          "No executable found" | Out-File rendertest\error.txt
          Compress-Archive -Path rendertest\* -DestinationPath rendertest.zip -Force
          return
        }
        try { & $exe.FullName --help 2>&1 | Out-File -FilePath rendertest\help.txt -Encoding utf8 } catch { }
        $scene = Get-ChildItem -Path $env:PROJECT_SRC -Include *.scene,*.json -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($scene) {
          try { & $exe.FullName $scene.FullName -o rendertest\test.exr 2>&1 | Out-File -FilePath rendertest\render.log -Encoding utf8 } catch { }
        }
        Compress-Archive -Path rendertest\* -DestinationPath rendertest.zip -Force

    # ================= ARTIFACTS =================
    - name: Upload CPU artefacts
      uses: actions/upload-artifact@v4
      with:
        name: LumiRender-CPU
        path: LumiRender-CPU.zip

    - name: Upload GPU artefacts
      uses: actions/upload-artifact@v4
      with:
        name: LumiRender-GPU
        path: LumiRender-GPU.zip

    - name: Upload rendertest
      uses: actions/upload-artifact@v4
      with:
        name: rendertest
        path: rendertest.zip
